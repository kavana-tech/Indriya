name: Build & deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mudra_sdk/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Sphinx + extensions
        run: python -m pip install --upgrade pip && pip install -r docs/requirements.txt

      - name: Build HTML with Sphinx
        run: sphinx-build -b html . _build/html
        working-directory: docs

      - name: Deploy to gh-pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        # Pin the exact patch tag: peaceiris's floating `v4` tag still points to
        # v4.0.0 (Node 20); the Node-24 runtime only landed in v4.1.0.
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: deploy ${{ github.sha }}"
